<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Prompt Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   NOCT hero — right-half loop: prompt → AI thinking → on-brand product.
   Artboard is the right half of the 1440×676 Figma hero (720×676) and
   scales to fit whatever box it is embedded in.
   Optional URL params:  ?bg=transparent | ?bg=ffffff   (default #fcfcfc)
------------------------------------------------------------------- */
:root{
  --bg:#fcfcfc;
  --ink:#1a1a1a;
  --ink-2:#3f3f3f;
  --muted:#999;
  --blue:#0059d5;
  --press:#2C6BD6;
  --ease-out:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Lato',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}

#stage{position:absolute;left:50%;top:50%;width:720px;height:676px;transform-origin:center;
  transform:translate(calc(-50% + var(--dx,0px)),-50%) scale(var(--s,1))}
#scene{position:absolute;inset:0}

/* motif */
.motif{position:absolute;left:158.38px;top:136.86px;width:403.24px;height:402.28px;
  transform:scale(.753);opacity:0;will-change:transform,opacity}
.motif img{display:block}
.motif.warp img{filter:url(#warp)}   /* only while thinking — static otherwise */
.contours{display:block;overflow:visible}
.contours path{fill:var(--motif-fill,#fcfcfc)}   /* each line hides what's behind it */

/* ---------- composer (prompt) ---------- */
.composer{position:absolute;left:150.15px;top:265.25px;width:419.7px;height:145.5px;
  background:#fff;border:1.399px solid rgba(0,0,0,.17);border-radius:15.109px;overflow:hidden;
  opacity:0;transform:scale(.82);will-change:transform,opacity}
.c-text{position:absolute;left:20.4px;top:16.8px;width:352px;font-size:20.286px;line-height:32.107px;
  color:var(--ink);transform-origin:0 0}
.chip-l{display:inline-block;background:#fbfbfb;border:.944px solid rgba(0,0,0,.16);border-radius:5.666px;
  padding:.665px 6.61px 2.588px;margin-left:-4.3px;margin-right:4px;font-weight:700;color:var(--blue);
  letter-spacing:-.2029px;line-height:1.25;vertical-align:1px}
.chip-l[hidden]{display:none}
.caret{position:relative}   /* zero-width so it never wraps on its own */
.caret::after{content:"";position:absolute;left:1px;top:2.5px;width:1.889px;height:22.664px;background:var(--ink)}
.caret.blink{animation:blink 1.06s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.send{position:absolute;right:10.49px;bottom:10.42px;width:33.996px;height:33.996px;border-radius:50%;
  background:var(--ink);display:grid;place-items:center;opacity:.22;transition:background-color .12s,transform .12s}
.send.on{opacity:1}
.send.press{background:var(--press);transform:scale(.92)}
/* bubble-sized copy of the prompt that fades in while the composer morphs */
.c-bubble{position:absolute;left:12.77px;top:12.7px;width:367.5px;opacity:0}

/* ---------- slash menu ---------- */
.menu{position:absolute;left:150.15px;top:419px;width:306px;background:#fff;border:1px solid rgba(0,0,0,.1);
  border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.05);padding:6px;
  opacity:0;transform:translateY(-6px) scale(.98);transform-origin:20px 0;pointer-events:none}
.menu-head{font-size:11px;letter-spacing:1.08px;text-transform:uppercase;color:var(--muted);padding:6px 10px 6px}
.m-item{display:grid;grid-template-rows:1fr;transition:grid-template-rows .2s var(--ease-out),opacity .16s}
.m-item>div{overflow:hidden}
.m-item.out{grid-template-rows:0fr;opacity:0}
.m-row{display:flex;align-items:center;justify-content:space-between;height:31px;padding:0 10px;border-radius:6px;
  font-size:14.5px;color:var(--ink-2);transition:background-color .12s,color .12s}
.m-row b{font-weight:700}
.m-item.hl .m-row{background:rgba(0,89,213,.08);color:var(--blue)}
.m-key{font-size:11px;color:var(--muted);opacity:0;transition:opacity .12s}
.m-item.hl .m-key{opacity:1}

/* ---------- pointer ---------- */
.pointer{position:absolute;left:623.65px;top:395.75px;width:30px;height:30px;opacity:0;will-change:transform,opacity}
.pointer img{position:absolute;left:7.5px;top:4.3px}

/* ---------- conversation ---------- */
.convo{position:absolute;left:89px;top:0;width:542px;display:flex;flex-direction:column;align-items:flex-start;gap:20px;
  transition:transform .5s var(--ease-out)}
.bubble-row{width:100%;display:flex;justify-content:flex-end}
.bubble{width:400.75px;height:64.75px;background:#fff;border:.875px solid rgba(0,0,0,.15);
  border-radius:14px 14px 3.5px 14px;padding:12.7px 0 0 12.77px;visibility:hidden}
.b-text{font-size:14px;line-height:21.35px;color:var(--ink);width:367.5px}
.chip-m{display:inline-block;background:#fbfbfb;border:.652px solid rgba(0,0,0,.16);border-radius:3.91px;
  padding:.459px 4.562px 1.786px;margin-left:-4.6px;margin-right:3px;font-weight:700;color:var(--blue);
  letter-spacing:-.14px;line-height:1.25}

.think{position:relative;background:#fcfcfc;border:.857px solid rgba(0,0,0,.08);border-radius:12px 12px 12px 3.5px;
  width:284.56px;padding:11.388px 10.633px;opacity:0;overflow:hidden}
.r-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease-out)}
.r-wrap.in{grid-template-rows:1fr}
.r-wrap>div{overflow:hidden}
.r-wrap+.r-wrap .row{margin-top:8.161px}
.row{position:relative;height:24px;opacity:0;transform:translateY(5px);transition:opacity .26s,transform .32s var(--ease-out)}
.r-wrap.in .row{opacity:1;transform:none}
.ico{position:absolute;left:0;top:1.71px;width:20.571px;height:20.571px}
.mark{position:absolute;left:1.71px;top:1.71px;width:17.142px;height:17.142px;opacity:0;transform:scale(.6) rotate(-25deg);
  transition:opacity .14s,transform .22s var(--ease-out)}
.mark.on{opacity:1;transform:none}
.mark.on img{animation:breathe .9s ease-in-out infinite}
.mark img{display:block}
@keyframes breathe{0%{opacity:1;transform:scale(.992)}22%{opacity:.78;transform:scale(.982)}47%{opacity:1;transform:scale(1)}
  72%{opacity:.84;transform:scale(.988)}100%{opacity:1;transform:scale(.996)}}
.tick{position:absolute;left:4.29px;top:4.29px;width:12px;height:12px;display:grid;place-items:center}
.tick path{stroke-dasharray:12;stroke-dashoffset:12}
.tick.on path{transition:stroke-dashoffset .28s var(--ease-out);stroke-dashoffset:0}
/* inline text, so the chip's text shares the line's baseline (as in Figma) */
.line{position:absolute;left:30.86px;top:0;height:24px;line-height:24px;white-space:nowrap;
  font-size:12.857px;color:var(--ink-2)}
.row.active .line{-webkit-mask-image:linear-gradient(90deg,#000 35%,rgba(0,0,0,.35) 50%,#000 65%);
  mask-image:linear-gradient(90deg,#000 35%,rgba(0,0,0,.35) 50%,#000 65%);
  -webkit-mask-size:300% 100%;mask-size:300% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{from{-webkit-mask-position:100% 0;mask-position:100% 0}to{-webkit-mask-position:0 0;mask-position:0 0}}
.chip-s{display:inline-block;vertical-align:baseline;margin:0 3.428px;background:rgba(255,255,255,.5);border:.857px solid rgba(0,0,0,.15);
  border-radius:5px;padding:0 5px 1px;font-size:11.3px;font-weight:700;color:var(--ink);line-height:15px}

/* collapsed summary line */
.done{position:absolute;left:10.633px;top:7.39px;display:flex;align-items:center;gap:8.161px;white-space:nowrap;
  font-size:13px;color:var(--ink-2);opacity:0}
.done .chk{width:18px;height:18px;display:grid;place-items:center}
.done .chk path{stroke-dasharray:14;stroke-dashoffset:14}
.done.on .chk path{transition:stroke-dashoffset .34s var(--ease-out) .08s;stroke-dashoffset:0}
.done .txt{display:flex;align-items:center;gap:3.293px}
.chev{display:block;transition:transform .35s var(--ease-out)}
.done.open .chev{transform:rotate(90deg)}

/* ---------- generated product ---------- */
.card{position:relative;width:542px;height:283px;border-radius:8px;background:#fff;
  box-shadow:0 2px 12px rgba(0,0,0,.1);opacity:0;transform:translateY(14px) scale(.97);transform-origin:50% 0;overflow:hidden;
  display:none}
.card::after{content:"";position:absolute;inset:0;border:1px solid #d9d9d9;border-radius:8px;pointer-events:none}
.piece,.skel{position:absolute}
.piece{background-image:url(assets/bluejeans-home.webp);background-size:542px 338.75px;background-repeat:no-repeat;opacity:0}
.skel{border-radius:4px;background:linear-gradient(90deg,#f1f3f6 0%,#e7ebf0 40%,#f1f3f6 80%);background-size:200% 100%;
  animation:skel 1.1s linear infinite;opacity:0}
@keyframes skel{from{background-position:100% 0}to{background-position:-100% 0}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="warp" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.0065 0.011" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap id="disp" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div id="stage" aria-label="A prompt using the BlueJeans design system is sent to an AI, which reasons step by step and builds a BlueJeans-branded homepage." role="img">
  <div id="scene">
    <div class="motif" id="motif"><!--figma--><img src="assets/motif.svg" alt=""><!--/figma--><!--code--><svg class="contours" id="contours" width="403.24" height="402.28" viewBox="0 0 403.24 402.28" aria-hidden="true">
        <defs>
          <clipPath id="cclip"><circle cx="201.62" cy="201.14" r="201.14"/></clipPath>
          <linearGradient id="cg1" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="403" y2="0"><stop offset="0" stop-color="#B0A8D3"/><stop offset=".17" stop-color="#9CD2D8"/><stop offset=".33" stop-color="#BEDCCE"/><stop offset=".5" stop-color="#E9D3C7"/><stop offset=".67" stop-color="#BCC3D2"/><stop offset=".83" stop-color="#D0A4CA"/><stop offset="1" stop-color="#EEC4C5"/></linearGradient>
          <linearGradient id="cg2" gradientUnits="userSpaceOnUse" x1="403" y1="60" x2="0" y2="340"><stop offset="0" stop-color="#B0A8D3"/><stop offset=".17" stop-color="#9CD2D8"/><stop offset=".33" stop-color="#BEDCCE"/><stop offset=".5" stop-color="#E9D3C7"/><stop offset=".67" stop-color="#BCC3D2"/><stop offset=".83" stop-color="#D0A4CA"/><stop offset="1" stop-color="#EEC4C5"/></linearGradient>
        </defs>
        <g id="clines" clip-path="url(#cclip)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></g>
      </svg><!--/code--></div>

    <div class="convo" id="convo">
      <div class="bubble-row"><div class="bubble" id="bubble">
        <div class="b-text"><span class="chip-m">/bluejeans-design-system</span> Build a homepage with upcoming meetings and recent activity</div>
      </div></div>
      <div class="think" id="think">
        <div id="rows"></div>
        <div class="done" id="done">
          <span class="chk"><svg width="10.8" height="8.2" viewBox="0 0 10.8 8.2" fill="none"><path d="M0.9 4.3L3.9 7.3L9.9 0.900003" stroke="#116B3C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="txt">Built your homepage from 8 BlueJeans components
            <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4.5 2.5L8 6L4.5 9.5" stroke="#3f3f3f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </div>
      </div>
      <div class="card" id="card"></div>
    </div>

    <div class="composer" id="composer">
      <div class="c-text" id="ctext"><span class="chip-l" id="chipL" hidden>/bluejeans-design-system</span><span id="typed"></span><span class="caret blink" id="caret"></span></div>
      <div class="c-bubble" id="cbubble"><div class="b-text"><span class="chip-m">/bluejeans-design-system</span> Build a homepage with upcoming meetings and recent activity</div></div>
      <div class="send" id="send"><img src="assets/arrow-up.svg" alt=""></div>
    </div>

    <div class="menu" id="menu"><div class="menu-head">Design systems</div><div id="mitems"></div></div>

    <div class="pointer" id="pointer"><img src="assets/pointer.svg" alt=""></div>
  </div>
</div>

<script>
(() => {
  /* ---------- config ---------- */
  const bg = new URLSearchParams(location.search).get('bg');
  if (bg) {
    const col = bg === 'transparent' ? 'transparent' : (/^[0-9a-f]{3,8}$/i.test(bg) ? '#' + bg : bg);
    document.documentElement.style.setProperty('--bg', col);
    if (col !== 'transparent') document.documentElement.style.setProperty('--motif-fill', col);   // contour masking needs a solid colour
  }

  const SYSTEMS = ['bah-design-system','bluejeans-design-system','polaris-design-system','rivali-park-design-system','tradesea-design-system','unity-design-system'];
  const TARGET = 'bluejeans-design-system';
  const PROMPT = ' Build a homepage with upcoming meetings and recent activity';
  const STEPS = [
    ['Reading', 'bluejeans design system', '…'],
    ['Loading project context…'],
    ['Found 18 relevant components'],
    ['Reading', 'button-rules.md', '…'],
    ['Understanding', 'layout.md', 'guidelines…'],
    ['Running', 'enterprise-ux-design', 'skill…'],
  ];
  const MARKS = ['claude','codex','cursor'];
  const MARK_SRC = { claude: 'assets/claude.svg', codex: 'assets/codex.svg', cursor: 'assets/cursor.svg' };
  // regions of the BlueJeans homepage, in card px (card 542×283, image 542×338.75) — the "8 components"
  const PIECES = [
    [0, 0, 82.7, 283],        // side nav
    [349.6, 0, 192.4, 25.7],  // search + create
    [105.7, 29.8, 298.1, 20.3],// greeting
    [105.7, 51.5, 295.4, 16.3],// date range + filter
    [104.3, 71, 296.7, 86.2],  // meetings 1–2
    [104.3, 157.2, 296.7, 76.4],// meetings 3–4
    [104.3, 233.6, 296.7, 50], // meetings 5+
    [424.1, 29.8, 117.9, 254], // recent activity
  ];

  /* ---------- elements ---------- */
  const $ = id => document.getElementById(id);
  const stage = $('stage'), scene = $('scene'), motif = $('motif'), composer = $('composer'), ctext = $('ctext'),
        chipL = $('chipL'), typed = $('typed'), caret = $('caret'), send = $('send'), cbubble = $('cbubble'),
        menu = $('menu'), mitems = $('mitems'), pointer = $('pointer'), convo = $('convo'), bubble = $('bubble'),
        think = $('think'), rowsEl = $('rows'), done = $('done'), card = $('card');

  /* ---------- fit to container ---------- */
  // wide: show the whole half-hero; narrow (stacked mobile hero): frame just the content (566×520 window),
  // centred on the artboard centre so the contour circle and the prompt box stay dead centre
  const fit = () => {
    const narrow = innerWidth < 720;
    const s = narrow ? Math.min(innerWidth / 566, innerHeight / 520) : Math.min(innerWidth / 720, innerHeight / 676);
    stage.style.setProperty('--s', s);
    stage.style.setProperty('--dx', '0px');
  };
  addEventListener('resize', fit); fit();

  /* ---------- timing helpers (abortable so the loop restarts cleanly) ---------- */
  let runId = 0;
  const ABORT = Symbol('abort');
  const wait = (ms, id) => new Promise((res, rej) => setTimeout(() => id === runId ? res() : rej(ABORT), ms));
  const anim = (el, kf, o) => el.animate(kf, { fill: 'forwards', easing: 'cubic-bezier(.2,.8,.2,1)', ...o });
  const clearAnims = el => el.getAnimations().forEach(a => a.cancel());

  /* ---------- contour motif: two variants, both still except while the AI thinks ----------
     figma — the Figma drawing, rippled by an SVG displacement filter
     code  — the noct.in homepage contours rebuilt as live SVG: stacked lines lifted into hills
             by a 3-D noise field (x, line, time), clipped to the circle
     Built files contain only one; the source picks with ?motif=code (default figma). */
  const contours = $('contours'), figmaImg = motif.querySelector('img');
  const MOTIF = contours && (!figmaImg || new URLSearchParams(location.search).get('motif') === 'code') ? 'code' : 'figma';
  if (MOTIF === 'code') figmaImg && figmaImg.remove(); else contours && contours.remove();

  // improved Perlin noise, seeded
  const P = new Uint8Array(512);
  { const a = [...Array(256).keys()]; let sd = 7;
    for (let i = 255; i > 0; i--) { sd = (sd * 16807) % 2147483647; const j = sd % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    for (let i = 0; i < 512; i++) P[i] = a[i & 255]; }
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10), lerp = (a, b, t) => a + t * (b - a);
  const grad = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : z); return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
  function noise(x, y, z) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    const u = fade(x), v = fade(y), w = fade(z);
    const A = P[X] + Y, AA = P[A] + Z, AB = P[A + 1] + Z, B = P[X + 1] + Y, BA = P[B] + Z, BB = P[B + 1] + Z;
    return lerp(lerp(lerp(grad(P[AA], x, y, z), grad(P[BA], x - 1, y, z), u), lerp(grad(P[AB], x, y - 1, z), grad(P[BB], x - 1, y - 1, z), u), v),
                lerp(lerp(grad(P[AA + 1], x, y, z - 1), grad(P[BA + 1], x - 1, y, z - 1), u), lerp(grad(P[AB + 1], x, y - 1, z - 1), grad(P[BB + 1], x - 1, y - 1, z - 1), u), v), w);
  }
  const C = { lines: 92, top: -50, bottom: 540, step: 5, amp: 104, fx: 0.0064, fy: 0.0125, oct: 0.2 };
  let clineEls = [], ct = 0.35;
  function contourInit() {
    const g = $('clines'); if (!g) return;
    g.innerHTML = Array.from({ length: C.lines }, (_, i) =>
      `<path stroke="url(#${i % 3 === 1 ? 'cg2' : 'cg1'})" stroke-opacity="${(0.5 + 0.3 * Math.abs(Math.sin(i * 0.37))).toFixed(2)}"/>`).join('');
    clineEls = [...g.children];
  }
  function contourDraw(t) {
    const gap = (C.bottom - C.top) / (C.lines - 1);
    for (let i = 0; i < C.lines; i++) {
      const yb = C.top + i * gap;
      let d = '', px = 0, py = 0;
      for (let x = -10; x <= 414; x += C.step) {
        // two octaves; squared so ridges rise out of flatter valleys, like the homepage terrain
        let n = noise(x * C.fx, yb * C.fy, t) + C.oct * noise(x * C.fx * 2.3, yb * C.fy * 2.3, t * 1.3 + 9);
        n = Math.min(1, Math.max(0, (n + 0.7) / 1.4)); n = n * n * (3 - 2 * n);   // smooth S-curved hills
        const y = yb - n * C.amp;
        if (x === -10) d = `M${x} ${y.toFixed(1)}`;
        else d += `Q${px} ${py.toFixed(1)} ${((px + x) / 2).toFixed(1)} ${((py + y) / 2).toFixed(1)}`;
        px = x; py = y;
      }
      clineEls[i].setAttribute('d', d + 'L420 620L-20 620Z');   // closed below: masks the ridges behind it
    }
  }
  if (MOTIF === 'code') { contourInit(); contourDraw(ct); }

  /* ---------- motion while thinking (warp for figma, flow for code) ---------- */
  const turb = $('turb'), disp = $('disp');
  let warpRaf = 0, warpAmt = 0, warpTarget = 0;
  let flowRaf = 0, flowV = 0, flowTarget = 0, flowLast = 0;
  function flowTick(ts) {
    const dt = flowLast ? Math.min(0.05, (ts - flowLast) / 1000) : 0; flowLast = ts;
    flowV += (flowTarget - flowV) * 0.04;          // ease the speed in and out
    ct += dt * flowV; contourDraw(ct);
    if (flowTarget === 0 && flowV < 0.002) { flowStop(); return; }
    flowRaf = requestAnimationFrame(flowTick);
  }
  function flowStop() { cancelAnimationFrame(flowRaf); flowRaf = 0; flowV = 0; flowLast = 0; }
  function warpTick(ts) {
    const t = ts / 1000;
    warpAmt += (warpTarget - warpAmt) * 0.05;
    turb.setAttribute('baseFrequency', `${(0.0065 + 0.0024 * Math.sin(t * 1.1)).toFixed(5)} ${(0.011 + 0.003 * Math.cos(t * 0.85)).toFixed(5)}`);
    disp.setAttribute('scale', warpAmt.toFixed(2));
    if (warpTarget === 0 && warpAmt < 0.05) { warpStop(); return; }
    warpRaf = requestAnimationFrame(warpTick);
  }
  function warpStop() { cancelAnimationFrame(warpRaf); warpRaf = 0; warpAmt = 0; disp.setAttribute('scale', 0); motif.classList.remove('warp'); }
  function warp(on) {
    if (MOTIF === 'code') { flowTarget = on ? 0.32 : 0; if (!flowRaf) flowRaf = requestAnimationFrame(flowTick); return; }
    warpTarget = on ? 24 : 0;
    if (on) motif.classList.add('warp');
    if (!warpRaf) warpRaf = requestAnimationFrame(warpTick);
  }

  /* ---------- builders ---------- */
  const markImg = n => `<span class="mark" data-m="${n}"><img src="${MARK_SRC[n]}" alt=""></span>`;
  function buildRow([a, chip, b]) {
    const w = document.createElement('div');
    w.className = 'r-wrap';
    w.innerHTML = `<div><div class="row"><div class="ico">${MARKS.map(markImg).join('')}
      <span class="tick"><svg width="9.26" height="7.03" viewBox="0 0 9.25673 7.02826" fill="none"><path d="M0.771394 3.68555L3.34271 6.25686L8.48533 0.771396" stroke="#116B3C" stroke-width="1.54279" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
      <div class="line"><span>${a}</span>${chip ? `<span class="chip-s">${chip}</span><span>${b}</span>` : ''}</div></div></div>`;
    return w;
  }
  function buildMenu() {
    mitems.innerHTML = SYSTEMS.map(s => `<div class="m-item" data-s="${s}"><div><div class="m-row"><span class="nm">/${s}</span><span class="m-key">↵</span></div></div></div>`).join('');
  }
  function filterMenu(q) {
    let first = null;
    mitems.querySelectorAll('.m-item').forEach(it => {
      const s = it.dataset.s, ok = s.startsWith(q);
      it.classList.toggle('out', !ok);
      it.classList.remove('hl');
      it.querySelector('.nm').innerHTML = '/' + (q && ok ? `<b>${s.slice(0, q.length)}</b>${s.slice(q.length)}` : s);
      if (ok && !first) first = it;
    });
    first && first.classList.add('hl');
  }
  function buildCard() {
    card.innerHTML = PIECES.map(([x, y, w, h]) =>
      `<div class="skel" style="left:${x + 3}px;top:${y + 3}px;width:${w - 6}px;height:${h - 6}px"></div>` +
      `<div class="piece" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background-position:${-x}px ${-y}px"></div>`).join('');
  }

  /* convo vertical position: centred stack, nudged up as in the Figma frames */
  const thinkH = n => 22.776 + 1.714 + n * 24 + Math.max(0, n - 1) * 8.161;
  const placeConvo = n => convo.style.transform = `translateY(${(676 - (64.75 + 20 + thinkH(n))) / 2 - 25}px)`;

  /* ---------- reset to frame 0 ---------- */
  function reset() {
    warpTarget = 0; warpStop();
    flowTarget = 0; flowStop(); if (MOTIF === 'code') { ct = 0.35; contourDraw(ct); }
    [scene, motif, composer, ctext, cbubble, send, menu, pointer, think, done, card, convo].forEach(clearAnims);
    convo.style.transition = 'none'; placeConvo(1); void convo.offsetHeight; convo.style.transition = '';
    typed.textContent = ''; chipL.hidden = true; caret.classList.add('blink'); caret.style.display = '';
    send.className = 'send';
    bubble.style.visibility = 'hidden'; composer.style.display = '';
    rowsEl.innerHTML = ''; done.className = 'done';
    think.style.width = think.style.height = think.style.padding = '';
    card.style.display = 'none'; buildCard(); buildMenu();
  }

  /* ---------- the sequence ---------- */
  async function play(id) {
    const W = ms => wait(ms, id);

    /* 1 · prompt */
    stage.dataset.phase = 'prompt';
    anim(scene, [{ opacity: 0 }, { opacity: 1 }], { duration: 300 });
    anim(motif, [{ opacity: 0, transform: 'scale(.753)' }, { opacity: 1, transform: 'scale(.753)' }], { duration: 700 });
    anim(composer, [{ opacity: 0, transform: 'scale(.82)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 650, delay: 120 });
    anim(pointer, [{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: 500 });
    await W(1300);

    caret.classList.remove('blink');
    const type = async (str, base = 52) => { for (const ch of str) { typed.textContent += ch; await W(base + Math.random() * 38 + (ch === ' ' ? 30 : 0)); } };

    await type('/');
    filterMenu('');
    anim(menu, [{ opacity: 0, transform: 'translateY(-6px) scale(.98)' }, { opacity: 1, transform: 'none' }], { duration: 220 });
    await W(300);
    await type('b', 60); filterMenu('b'); await W(130);
    await type('l', 60); filterMenu('bl'); await W(240);
    // select → chip
    anim(menu, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-4px) scale(.98)' }], { duration: 160 });
    typed.textContent = ''; chipL.hidden = false;
    anim(chipL, [{ transform: 'scale(.9)', background: 'rgba(0,89,213,.14)' }, { transform: 'scale(1)', background: '#fbfbfb' }], { duration: 360 });
    await W(260);
    await type(PROMPT, 30);
    send.classList.add('on');
    anim(send, [{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { duration: 260, fill: 'none' });
    caret.classList.add('blink');
    await W(250);

    // pointer glides to send and clicks
    anim(pointer, [{ transform: 'translate(0,0)' }, { transform: 'translate(-89.5px,-16.5px)' }], { duration: 520, easing: 'cubic-bezier(.45,0,.2,1)' });
    await W(560);
    send.classList.add('press'); anim(pointer, [{ transform: 'translate(-89.5px,-16.5px) scale(1)' }, { transform: 'translate(-89.5px,-16.5px) scale(.88)' }, { transform: 'translate(-89.5px,-16.5px) scale(1)' }], { duration: 160 });
    await W(120); send.classList.remove('press'); caret.style.display = 'none';
    anim(pointer, [{ opacity: 1 }, { opacity: 0 }], { duration: 300, delay: 120 });

    /* 2 · composer morphs into the sent message */
    stage.dataset.phase = 'morph';
    const ty = (676 - (64.75 + 20 + thinkH(1))) / 2 - 25;
    const M = { duration: 460, easing: 'cubic-bezier(.3,.7,.1,1)' };
    anim(composer, [
      { left: '150.15px', top: '265.25px', width: '419.7px', height: '145.5px', borderRadius: '15.109px', borderWidth: '1.399px', borderColor: 'rgba(0,0,0,.17)' },
      { left: '230.25px', top: ty + 'px', width: '400.75px', height: '64.75px', borderRadius: '14px 14px 3.5px 14px', borderWidth: '.875px', borderColor: 'rgba(0,0,0,.15)' }], M);
    anim(ctext, [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.69)' }], { duration: 220 });
    anim(send, [{ opacity: 1 }, { opacity: 0 }], { duration: 140 });
    anim(cbubble, [{ opacity: 0 }, { opacity: 1 }], { duration: 260, delay: 160 });
    anim(motif, [{ transform: 'scale(.753)' }, { transform: 'scale(1)' }], { duration: 1100 });
    await W(480);
    bubble.style.visibility = 'visible'; composer.style.display = 'none';

    /* 3 · thinking */
    stage.dataset.phase = 'thinking';
    warp(true);
    anim(think, [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 280 });
    for (let i = 0; i < STEPS.length; i++) {
      const last = i === STEPS.length - 1;
      const w = buildRow(STEPS[i]); rowsEl.appendChild(w);
      placeConvo(i + 1);
      void w.offsetHeight; w.classList.add('in');
      const row = w.querySelector('.row'); row.classList.add('active');
      const marks = [...w.querySelectorAll('.mark')];
      const dwell = last ? 720 : 360, cycles = last ? 2 : 1;
      await W(120);
      for (let c = 0; c < cycles; c++) for (const m of marks) {
        marks.forEach(x => x.classList.remove('on')); m.classList.add('on');
        await W(dwell);
      }
      marks.forEach(x => x.classList.remove('on'));
      row.classList.remove('active');
      w.querySelector('.tick').classList.add('on');
      await W(last ? 420 : 200);
    }

    /* 4 · collapse to the summary line */
    stage.dataset.phase = 'collapse';
    warp(false);
    const from = think.getBoundingClientRect(), s = parseFloat(getComputedStyle(stage).getPropertyValue('--s')) || 1;
    const fw = from.width / s, fh = from.height / s;
    const tw = done.offsetWidth + 2 * 10.633 + 1.714, th = 18 + 2 * 7.39 + 1.714;
    think.style.width = fw + 'px'; think.style.height = fh + 'px';
    [...rowsEl.children].reverse().forEach((w, k) => anim(w, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-4px)' }], { duration: 200, delay: k * 30 }));
    await W(120);
    anim(think, [{ width: fw + 'px', height: fh + 'px' }, { width: tw + 'px', height: th + 'px' }], { duration: 420 });
    convo.style.transform = 'translateY(103px)';
    await W(150);
    done.classList.add('on');
    anim(done, [{ opacity: 0, transform: 'translateY(3px)' }, { opacity: 1, transform: 'none' }], { duration: 260 });
    await W(420);

    /* 5 · the product */
    stage.dataset.phase = 'product';
    card.style.display = 'block';
    done.classList.add('open');
    anim(card, [{ opacity: 0, transform: 'translateY(14px) scale(.97)' }, { opacity: 1, transform: 'none' }], { duration: 520 });
    const skels = [...card.querySelectorAll('.skel')], pieces = [...card.querySelectorAll('.piece')];
    skels.forEach((k, i) => anim(k, [{ opacity: 0 }, { opacity: 1 }], { duration: 200, delay: 120 + i * 30 }));
    await W(620);
    pieces.forEach((p, i) => {
      const d = i * 120;
      anim(p, [{ opacity: 0, transform: 'translateY(6px)', filter: 'blur(3px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 440, delay: d });
      anim(skels[i], [{ opacity: 1 }, { opacity: 0 }], { duration: 240, delay: d + 80 });
    });
    await W(PIECES.length * 120 + 500);

    /* hold, then out */
    await W(3600);
    anim(scene, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(.985)' }], { duration: 500, easing: 'ease-in' });
    await W(700);
  }

  function showFinal() {   // reduced motion: the outcome, still
    reset();
    composer.style.display = 'none'; bubble.style.visibility = 'visible';
    motif.style.opacity = 1; motif.style.transform = 'none';
    const tw = done.offsetWidth + 2 * 10.633 + 1.714;
    think.style.opacity = 1; think.style.width = tw + 'px'; think.style.height = (18 + 2 * 7.39 + 1.714) + 'px';
    done.className = 'done on open'; done.style.opacity = 1;
    card.style.display = 'block'; card.style.opacity = 1; card.style.transform = 'none';
    card.querySelectorAll('.piece').forEach(p => p.style.opacity = 1);
    convo.style.transform = 'translateY(103px)';
  }

  async function loop() {
    const id = ++runId;
    try { for (;;) { reset(); await play(id); } } catch (e) { if (e !== ABORT) throw e; }
  }
  const stop = () => { runId++; };

  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const start = () => (reduced.matches ? showFinal() : loop());

  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
    // start from the top whenever the embed scrolls into view; pause when it leaves
    if ('IntersectionObserver' in window) {
      let visible = false;
      new IntersectionObserver(([e]) => {
        if (e.isIntersecting && !visible) { visible = true; start(); }
        else if (!e.isIntersecting && visible) { visible = false; stop(); }
      }, { threshold: .25 }).observe(document.body);
    } else start();
  });
})();
</script>
</body>
</html>
